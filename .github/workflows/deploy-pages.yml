# Déploiement automatique GitHub Pages.
#
# À chaque push sur main (ou déclenchement manuel depuis l'onglet Actions) :
#   1. installation des dépendances avec Bun (bun.lock gelé, version épinglée) ;
#   2. build SPA : GH_PAGES=1 bun run build → .output/public (base /smart-verif/) ;
#   3. préparation de la sortie : _shell.html renommé en index.html + fichier .nojekyll
#      (processus documenté dans le README, section « Déploiement GitHub Pages ») ;
#   4. publication du contenu sur la branche gh-pages via le worktree _gh-pages
#      (commit uniquement si le contenu a réellement changé, avance rapide, jamais de force).
#
# GitHub déploie ensuite la branche gh-pages (source « Deploy from a branch »,
# workflow dynamique « pages-build-deployment ») vers https://hitifok.github.io/smart-verif/
#
# 0 changement de règle comptable : le site publié reflète exactement main.

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build SPA et publication gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet, branche gh-pages incluse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Bun (version épinglée)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances (bun.lock gelé)
        run: bun install --frozen-lockfile

      - name: Build SPA GitHub Pages (GH_PAGES=1)
        run: GH_PAGES=1 bun run build

      - name: Préparer la sortie (_shell.html → index.html, .nojekyll)
        run: |
          cd .output/public
          if [ -f _shell.html ]; then
            mv _shell.html index.html
          fi
          test -f index.html || { echo "ERREUR : index.html absent de la sortie de build" >&2; exit 1; }
          touch .nojekyll

      - name: Publier sur gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add _gh-pages origin/gh-pages
          rsync -a --delete --exclude '.git' .output/public/ _gh-pages/
          cd _gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site déjà à jour — aucun commit de déploiement nécessaire."
            exit 0
          fi
          git commit -m "Déploiement gh-pages : main ${GITHUB_SHA} (workflow)"
          git push origin HEAD:gh-pages
